# Render deployment blueprint for Vitals
# Deploys: 1 web service (API + WebSocket + dashboard) + 1 free Postgres.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: vitals
    runtime: node
    plan: free
    region: oregon
    buildCommand: |
      corepack enable
      corepack prepare pnpm@12.4.2 --activate
      pnpm install --frozen-lockfile
      pnpm typecheck
      pnpm --filter @vitals/dashboard build
    startCommand: pnpm --filter @vitals/server start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vitals-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: CHAOS_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: info

databases:
  - name: vitals-db
    plan: free
    region: oregon
